name: Functional Tests

on:
  push:
  pull_request:

jobs:
  test-lib:
    runs-on: ubuntu-latest
    strategy:
      # Run every suite even when one of them fails
      fail-fast: false
      matrix:
        suite: [arrays, cli, config, datatypes, logging, run, string]
    defaults:
      run:
        working-directory: lib
    env:
      DRB_LIB: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run ${{ matrix.suite }} tests
        run: bash ./test.${{ matrix.suite }}.sh

  test-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The suite sets its own DRB_* paths. media-fixtags installs exiftool itself (Require).
      - name: Run media script tests
        run: bash media.lib/test.media.sh
